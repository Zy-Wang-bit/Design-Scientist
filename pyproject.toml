[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "design-scientist"
version = "0.3.0"
description = "Local data-grounded design scientist framework for iterative variant design"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.14.3",
  "httpx>=0.27",
  "pandas>=2.0",
  "pypdf>=6.11.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
design-scientist = "design_scientist.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
